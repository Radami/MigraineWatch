name: MigraineWatch

options:
  bundleIdPrefix: com.radami
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "5.0"

targets:
  MigraineWatch:
    type: application
    platform: iOS
    sources:
      - MigraineWatch
    info:
      path: MigraineWatch/Info.plist
      properties:
        CFBundleDisplayName: MigraineWatch
        UILaunchScreen: {}
        UIBackgroundModes:
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - com.radami.migrainewatch.refresh
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.radami.migrainewatch
        FRAMEWORK_SEARCH_PATHS: "$(inherited) $(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        OTHER_LDFLAGS: "$(inherited) -framework Shared"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    preBuildScripts:
      - name: Build the shared Kotlin framework
        basedOnDependencyAnalysis: false
        script: |
          export JAVA_HOME="${JAVA_HOME:-/Applications/Android Studio.app/Contents/jbr/Contents/Home}"
          cd "$SRCROOT/.."
          ./gradlew :shared:embedAndSignAppleFrameworkForXcode
